# A pipeline CI/CD realizar duas funções especificas, sendo elas:
#   1. Realizar a sincronização do repositório do AzureDevOps com o GitHub;
#   2. Realizar o deploy no servidor de dev ou produção a depender se houve merge nas branchs de
#  dev ou na main;

trigger:
  branches:
    include:
      - dev
      - main
  paths:
    include:
      - backend/*

pool:
  vmImage: ubuntu-latest

variables:
  ${{ if eq(variables['Build.SourceBranchName'], 'dev')}}:
    DEPLOY_ON: "dev"
    GITHUB_BRANCH: "dev"
  ${{ if eq(variables['Build.SourceBranchName'], 'main')}}:
    DEPLOY_ON: "prod"
    GITHUB_BRANCH: "main"

stages:
  - stage: Test
    displayName: "Run Tests"
    jobs:
      - job: RunTests
        displayName: "Run Backend Tests"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.12"
            displayName: "Setup Python 3.12"

          - script: |
              cd backend
              python -m pip install --upgrade pip
              pip install uv
              uv pip install --system -r requirements.txt
            displayName: "Install dependencies"

          - script: |
              cd backend
              pytest -m "not slow and not integration and not e2e" --tb=short --junitxml=test-results.xml
            displayName: "Run pytest"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: "backend/test-results.xml"
              testRunTitle: "Backend Tests"
            displayName: "Publish test results"

  - stage: BuildAndDeploy
    displayName: "Build & Deploy Worker on Docker"
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: SyncAzureAndGithub
        displayName: Sincronizar Azure e GitHub
        steps:
          - script: |
              echo "🌍 Informação do ambiente:"
              echo "Branch: $(Build.SourceBranchName)"
              echo "GitHub branch: $(GITHUB_BRANCH)"
              echo "Realizando o deploy em: $(DEPLOY_ON)"
            displayName: "Infomação do ambiente"

          - script: |
              echo "🔧 Configurando Git para GitHub push..."
              git config --global user.email "azure-pipeline@autochecker.cloud"
              git config --global user.name "Azure Pipeline"
              git config --global init.defaultBranch main
            displayName: "Configurando o Git"

          - script: |
              echo "🔄 Sincronizando código com GitHub..."

              # Mostrar informações de debug
              echo "📍 Branch atual: $(Build.SourceBranchName)"
              echo "📍 Branch GitHub: $(GITHUB_BRANCH)"

              # Criar uma cópia limpa do código atual
              echo "📦 Criando cópia limpa do código..."
              cd $(Agent.BuildDirectory)
              cp -r s/. github-sync/
              cd github-sync

              # Remover .git existente e inicializar novo repositório
              rm -rf .git
              git init
              git config user.email "azure-pipeline@autochecker.cloud"
              git config user.name "Azure Pipeline"

              # Adicionar todos os arquivos
              git add .
              git commit -m "Sincronização do Azure DevOps - Build $(Build.BuildNumber)"

              # Configurar remote do GitHub
              git remote add origin https://rochaTarcisio:$(GITHUB_TOKEN)@github.com/automindssa/AutoChecker.git

              # Push forçado para sobrescrever histórico
              git push origin HEAD:$(GITHUB_BRANCH) --force

              echo "✅ Código sincronizado com sucesso!"    
              echo "📍 Pushed clean copy to $(GITHUB_BRANCH)"
            displayName: "Sync to GitHub"
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)

      - job: DeployBackendOnDev
        steps:
          - task: SSH@0
            condition: eq(variables['Build.SourceBranchName'], 'dev')
            displayName: "Acessar servidor backend"
            inputs:
              sshEndpoint: "backend-dev"
              runOptions: "inline"
              failOnStdErr: false
              inline: |
                echo "✅ Conexão SSH realizada!"

                DIR="/home/checkerdev/AutoChecker"
                if [ -d "$DIR" ]; then
                  echo "✅ A pasta $DIR existe"
                else
                  echo "❌ A pasta $DIR não existe."
                  exit 1 
                fi

                cd $DIR || exit 1

                echo "ℹ️ Realizar o pull da branch $GITHUB_BRANCH"
                git pull origin $GITHUB_BRANCH 2>&1

                COMMIT_HASH=$(git rev-parse --short HEAD)
                echo "ℹ️ Setting SENTRY_RELEASE=backend@$COMMIT_HASH"
                sed -i "s/^SENTRY_RELEASE=.*/SENTRY_RELEASE=backend@$COMMIT_HASH/" backend/.env 2>/dev/null || echo "SENTRY_RELEASE=backend@$COMMIT_HASH" >> backend/.env

                echo "ℹ️ Acessar 'venv' e realizar o migrate para o banco"
                cd backend/
                source venv/bin/activate

                echo "ℹ️ Rodando as migrações..."
                python manage.py migrate --plan
                MIGRATE_PLAN=$?

                if [ $MIGRATE_PLAN -ne 0 ]; then
                  echo "❌ Falha ao listar plano de migrações."
                  exit 1
                fi

                echo "ℹ️ Executando migrações..."
                python manage.py migrate
                MIGRATE_RESULT=$?

                if [ $MIGRATE_RESULT -eq 0 ]; then
                  echo "✅ Migrações aplicadas com sucesso!"
                else
                  echo "❌ Erro ao aplicar migrações. Verifique os logs acima."
                  exit 1
                fi

                deactivate

                echo "ℹ️ Verificar Status do backend"
                if sudo systemctl status autochecker-backend.service > /dev/null 2>&1; then
                  echo "✅ Backend em execução"
                  echo "ℹ️ Reiniciando backend"
                  sudo systemctl restart autochecker-backend.service
                else
                  echo "🚦 O serviço do backend não está em execução"
                  echo "ℹ️ Re-executando o backend"
                  sudo cp ./backend/script/autochecker-backend.service /etc/systemd/system/
                  sudo systemctl daemon-reload
                  sudo systemctl enable autochecker-backend.service
                  sudo systemctl start autochecker-backend.service
                fi

                sleep 5

                if sudo systemctl status autochecker-backend.service > /dev/null 2>&1; then
                  echo "✅ Backend em execução"
                else
                  echo "❌ Backend não foi executado"
                  exit 1
                fi
            env:
              DEPLOY_ON: $(DEPLOY_ON)

      - job: DeployBackendOnProd
        steps:
          - task: SSH@0
            condition: eq(variables['Build.SourceBranchName'], 'main')
            displayName: "Acessar servidor backend"
            inputs:
              sshEndpoint: "backend-prod"
              runOptions: "inline"
              failOnStdErr: false
              inline: |
                echo "✅ Conexão SSH realizada!"

                DIR="/home/checkerprod/AutoChecker"
                if [ -d "$DIR" ]; then
                  echo "✅ A pasta $DIR existe"
                else
                  echo "❌ A pasta $DIR não existe."
                  exit 1 
                fi

                cd $DIR || exit 1

                echo "ℹ️ Realizar o pull da branch main"
                git pull origin main

                COMMIT_HASH=$(git rev-parse --short HEAD)
                echo "ℹ️ Setting SENTRY_RELEASE=backend@$COMMIT_HASH"
                sed -i "s/^SENTRY_RELEASE=.*/SENTRY_RELEASE=backend@$COMMIT_HASH/" backend/.env 2>/dev/null || echo "SENTRY_RELEASE=backend@$COMMIT_HASH" >> backend/.env

                echo "ℹ️ Verificar Status do backend"
                if sudo systemctl status autochecker-backend.service > /dev/null 2>&1; then
                  echo "✅ Backend em execução"
                  echo "ℹ️ Reiniciando backend"
                  sudo systemctl restart autochecker-backend.service
                else
                  echo "🚦 O serviço do backend não está em execução"
                  echo "ℹ️ Re-executando o backend"
                  sudo cp ./backend/script/autochecker-backend.service /etc/systemd/system/
                  sudo systemctl daemon-reload
                  sudo systemctl enable autochecker-backend.service
                  sudo systemctl start autochecker-backend.service
                fi

                sleep 5

                if sudo systemctl status autochecker-backend.service > /dev/null 2>&1; then
                  echo "✅ Backend em execução"
                else
                  echo "❌ Backend não foi executado"
                  exit 1
                fi
            env:
              DEPLOY_ON: $(DEPLOY_ON)
