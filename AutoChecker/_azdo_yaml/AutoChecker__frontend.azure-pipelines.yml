# Azure DevOps Pipeline - AutoChecker Frontend
# Deploy automático para DigitalOcean App Platform

trigger:
  branches:
    include:
      - dev
      - main
  paths:
    include:
      - frontend/*

pool:
  vmImage: ubuntu-latest

variables:
  FRONTEND_PATH: "frontend"
  # Variáveis condicionais baseadas na branch
  ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
    APP_ID: $(DEV_APP_ID)
    APP_SPEC_FILE: ".do/app-dev.yml"
    ENVIRONMENT_NAME: "development"
    GITHUB_BRANCH: "dev"
  ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    APP_ID: $(PROD_APP_ID)
    APP_SPEC_FILE: ".do/app-prod.yml"
    ENVIRONMENT_NAME: "production"
    GITHUB_BRANCH: "main"

stages:
  - stage: Test
    displayName: "Run Tests"
    jobs:
      - job: RunTests
        displayName: "Run Frontend Unit Tests"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"
            displayName: "Setup Node.js 20.x"

          - script: npm install -g npm@11
            displayName: "Upgrade npm to 11.x"

          - script: |
              cd frontend
              npm ci
            displayName: "Install dependencies"

          - script: |
              cd frontend
              npm run test:run -- --reporter=junit --outputFile=test-results.xml
            displayName: "Run vitest"

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: "frontend/test-results.xml"
              testRunTitle: "Frontend Unit Tests"
            displayName: "Publish test results"

  - stage: BuildAndDeploy
    displayName: "Build and Deploy Frontend"
    dependsOn: Test
    condition: succeeded()
    jobs:
      - job: DeployFrontend
        displayName: "Build and Deploy to DigitalOcean"
        steps:
          # 1. Mostrar informações do ambiente
          - script: |
              echo "🌍 Informação do ambiente:"
              echo "Branch: $(Build.SourceBranchName)"
              echo "Environment: $(ENVIRONMENT_NAME)"
              echo "App ID: $(APP_ID)"
              echo "Spec file: $(APP_SPEC_FILE)"
              echo "GitHub branch: $(GITHUB_BRANCH)"
            displayName: "Environment Info"

          # 2. Configurar Git para push no GitHub
          - script: |
              echo "🔧 Configuring Git for GitHub push..."
              git config --global user.email "azure-pipeline@autochecker.cloud"
              git config --global user.name "Azure Pipeline"
              git config --global init.defaultBranch main
            displayName: "Configure Git"

          # 3. Sincronizar código com GitHub
          - script: |
              echo "🔄 Sincronizando código com GitHub..."
              
              # Mostrar informações de debug
              echo "📍 Branch atual: $(Build.SourceBranchName)"
              echo "📍 Branch GitHub: $(GITHUB_BRANCH)"
              
              # Criar uma cópia limpa do código atual
              echo "📦 Criando cópia limpa do código..."
              cd $(Agent.BuildDirectory)
              cp -r s/. github-sync/
              cd github-sync
              
              # Remover .git existente e inicializar novo repositório
              rm -rf .git
              git init
              git config user.email "azure-pipeline@autochecker.cloud"
              git config user.name "Azure Pipeline"
              
              # Adicionar todos os arquivos
              git add .
              git commit -m "Sincronização do Azure DevOps - Build $(Build.BuildNumber)"
              
              # Configurar remote do GitHub
              git remote add origin https://rochaTarcisio:$(GITHUB_TOKEN)@github.com/automindssa/AutoChecker.git
              
              # Push forçado para sobrescrever histórico
              git push origin HEAD:$(GITHUB_BRANCH) --force
              
              echo "✅ Código sincronizado com sucesso!"    
              echo "📍 Pushed clean copy to $(GITHUB_BRANCH)"
            displayName: "Sync to GitHub"
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
